# Shared runtime for the tracked environment profiles. No credentials in environment values.
services:
  postgres:
    image: postgres:16.15-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD_FILE: /run/secrets/ticketing_db_password
    secrets: [ticketing_db_password]
    volumes:
      - ticketing_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    image: ${TICKETING_API_IMAGE:?Select an environment image}
    pull_policy: never
    environment: &runtime_environment
      APP_ENV: ${APP_ENV:?Select an environment}
      DB_DSN: pgsql:host=postgres;port=5432;dbname=ticketing
      DB_USER: ticketing
      DB_PASSWORD_FILE: /run/secrets/ticketing_db_password
    secrets: [ticketing_db_password]
    ports:
      - "127.0.0.1:${TICKETING_API_PORT:?Select a local API port}:8080"
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/api/v1/health/ready') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  migrate:
    image: ${TICKETING_API_IMAGE:?Select an environment image}
    pull_policy: never
    command: [php, bin/console.php, migrate]
    environment: *runtime_environment
    secrets: [ticketing_db_password]
    depends_on:
      postgres: {condition: service_healthy}
    profiles: [tools]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  ticketing_db_password:
    file: ${TICKETING_DB_PASSWORD_FILE:?Set the private database secret path}
volumes:
  ticketing_data: {}
networks:
  default:
    internal: ${TICKETING_NETWORK_INTERNAL:-false}
    ipam:
      config:
        - subnet: ${TICKETING_NETWORK_SUBNET:?Choose an unused subnet}
