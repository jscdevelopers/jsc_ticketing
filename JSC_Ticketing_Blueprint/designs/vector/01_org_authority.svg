<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="960" viewBox="0 0 1640 960"><style>text{font-family:'Segoe UI',Arial,sans-serif} .line{stroke:#b8cabe;stroke-width:3;fill:none}.arrow{stroke:#738f7f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#738f7f"/></marker></defs><rect x="0" y="0" width="1640" height="960" rx="0" fill="#f4f7f5"/><rect x="0" y="0" width="1640" height="90" rx="0" fill="#074933"/><text x="34" y="42" font-size="28" fill="#fff" font-weight="780" text-anchor="start">Org model: station vs nationwide authority</text><text x="34" y="70" font-size="14" fill="#b8d5c7" font-weight="500" text-anchor="start">JSC Ticketing  •  Editable workflow / architecture design reference</text><rect x="50" y="120" width="1540" height="78" rx="12" fill="#fff" stroke="#d5e5db" stroke-width="1"/><text x="85" y="151" font-size="18" fill="#07543c" font-weight="800" text-anchor="start">Core rule</text><text x="210" y="151" font-size="18" fill="#263b31" font-weight="500" text-anchor="start">Secretariat is a station. National authority comes only from a separate, approved grant.</text><rect x="80" y="265" width="410" height="110" rx="12" fill="#e9f7ee" stroke="#2f9866" stroke-width="2"/><text x="285.0" y="296" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Provinces</text><text x="285.0" y="320" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Geographic administration</text><rect x="80" y="458" width="410" height="110" rx="12" fill="#eaf4fe" stroke="#75a8da" stroke-width="2"/><text x="285.0" y="489" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Stations</text><text x="285.0" y="513" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Includes Secretariat station</text><path d="M285,375 L285,458" class="arrow"/><rect x="575" y="265" width="430" height="110" rx="12" fill="#e9f7ee" stroke="#2f9866" stroke-width="2"/><text x="790.0" y="296" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Departments</text><text x="790.0" y="320" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Cross-station service domains</text><rect x="575" y="458" width="430" height="110" rx="12" fill="#eaf4fe" stroke="#75a8da" stroke-width="2"/><text x="790.0" y="489" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Positions &amp; Postings</text><text x="790.0" y="513" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Effective-dated staff assignments</text><path d="M785,375 L785,458" class="arrow"/><rect x="1075" y="265" width="460" height="110" rx="12" fill="#fff4de" stroke="#dfad4b" stroke-width="2"/><text x="1305.0" y="296" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Roles &amp; Permissions</text><text x="1305.0" y="320" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Authority for each permitted action</text><rect x="1075" y="458" width="460" height="110" rx="12" fill="#f3edff" stroke="#b4a0da" stroke-width="2"/><text x="1305.0" y="489" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Explicit scope grants</text><text x="1305.0" y="513" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Self / Station / Province / National</text><path d="M1305,375 L1305,458" class="arrow"/><rect x="200" y="670" width="1240" height="190" rx="16" fill="#fff" stroke="#d3e4d7" stroke-width="1"/><text x="230" y="713" font-size="19" fill="#0d5d42" font-weight="750" text-anchor="start">Example A: working at Secretariat</text><text x="230" y="747" font-size="17" fill="#263b31" font-weight="500" text-anchor="start">Station = Secretariat   •   Position = Records Clerk   •   National grant = NO</text><text x="230" y="787" font-size="18" fill="#aa4c45" font-weight="700" text-anchor="start">Result: local scope only. No nationwide dashboard by default.</text><text x="230" y="835" font-size="17" fill="#0b7b51" font-weight="700" text-anchor="start">Example B: posted at a different station + approved national grant → allowed national dashboard.</text></svg>