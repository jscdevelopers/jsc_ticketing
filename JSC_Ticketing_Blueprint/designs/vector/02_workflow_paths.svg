<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1020" viewBox="0 0 1810 1020"><style>text{font-family:'Segoe UI',Arial,sans-serif} .line{stroke:#b8cabe;stroke-width:3;fill:none}.arrow{stroke:#738f7f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#738f7f"/></marker></defs><rect x="0" y="0" width="1810" height="1020" rx="0" fill="#f4f7f5"/><rect x="0" y="0" width="1810" height="90" rx="0" fill="#074933"/><text x="34" y="42" font-size="28" fill="#fff" font-weight="780" text-anchor="start">Category-driven multi-department workflow and one-winner claim</text><text x="34" y="70" font-size="14" fill="#b8d5c7" font-weight="500" text-anchor="start">JSC Ticketing  •  Editable workflow / architecture design reference</text><text x="90" y="152" font-size="19" fill="#263b31" font-weight="500" text-anchor="start">Start from any authorized initiator; route by category, station, province, position and explicit national grants.</text><rect x="75" y="230" width="170" height="95" rx="12" fill="#e9f7ee" stroke="#2f9866" stroke-width="2"/><text x="160.0" y="261" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Submit</text><text x="160.0" y="285" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Dynamic intake</text><rect x="335" y="230" width="180" height="95" rx="12" fill="#eaf4fe" stroke="#75a8da" stroke-width="2"/><text x="425.0" y="261" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Validate</text><text x="425.0" y="285" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Category + form</text><rect x="605" y="230" width="190" height="95" rx="12" fill="#fff4de" stroke="#dfad4b" stroke-width="2"/><text x="700.0" y="261" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Decision</text><text x="700.0" y="285" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Category A?</text><path d="M245,276 L335,276" class="arrow"/><path d="M515,276 L605,276" class="arrow"/><rect x="900" y="165" width="270" height="95" rx="12" fill="#eaf4fe" stroke="#75a8da" stroke-width="2"/><text x="1035.0" y="196" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Department X</text><text x="1035.0" y="220" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Configured scope / position</text><rect x="900" y="355" width="270" height="95" rx="12" fill="#eaf4fe" stroke="#75a8da" stroke-width="2"/><text x="1035.0" y="386" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Category Owner</text><text x="1035.0" y="410" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Fallback, not assumption</text><path d="M795,275 L855,275" class="line"/><polyline points="855,275 855,212 900,212" fill="none" stroke="#b1c9b9" stroke-width="3"/><path d="M855,212 L900,212" class="arrow"/><polyline points="855,275 855,402 900,402" fill="none" stroke="#b1c9b9" stroke-width="3"/><path d="M855,402 L900,402" class="arrow"/><text x="815" y="207" font-size="13" fill="#166b4b" font-weight="700" text-anchor="start">YES</text><text x="818" y="396" font-size="13" fill="#885510" font-weight="700" text-anchor="start">OTHER</text><rect x="1325" y="260" width="390" height="132" rx="12" fill="#f3edff" stroke="#b4a0da" stroke-width="2"/><text x="1520.0" y="291" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">One claimable task</text><text x="1520.0" y="315" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Offer to many; first valid claim wins</text><path d="M1170,212 L1280,212" class="line"/><polyline points="1280,212 1280,326 1325,326" fill="none" stroke="#b1c9b9" stroke-width="3"/><path d="M1280,326 L1325,326" class="arrow"/><polyline points="1170,402 1280,402 1280,326" fill="none" stroke="#b1c9b9" stroke-width="3"/><path d="M1280,402 L1280,326" class="arrow"/><rect x="110" y="545" width="1590" height="78" rx="12" fill="#fff" stroke="#dae6df" stroke-width="1"/><text x="145" y="579" font-size="20" fill="#135b43" font-weight="800" text-anchor="start">Claim = exactly one worker</text><text x="145" y="605" font-size="15" fill="#6c8175" font-weight="500" text-anchor="start">All candidates remain in the audit record; other users cannot claim after the first commits.</text><rect x="230" y="700" width="250" height="90" rx="12" fill="#f3edff" stroke="#b4a0da" stroke-width="2"/><text x="355.0" y="731" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Finance review</text><text x="355.0" y="755" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Separate independent task</text><rect x="230" y="830" width="250" height="90" rx="12" fill="#f3edff" stroke="#b4a0da" stroke-width="2"/><text x="355.0" y="861" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Legal review</text><text x="355.0" y="885" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Separate independent task</text><rect x="630" y="762" width="210" height="90" rx="12" fill="#fff4de" stroke="#dfad4b" stroke-width="2"/><text x="735.0" y="793" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Join ALL</text><text x="735.0" y="817" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Wait for both reviews</text><rect x="990" y="762" width="280" height="90" rx="12" fill="#e9f7ee" stroke="#2f9866" stroke-width="2"/><text x="1130.0" y="793" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Authorized approval</text><text x="1130.0" y="817" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Role AND active scope grant</text><rect x="1430" y="762" width="170" height="90" rx="12" fill="#e9f7ee" stroke="#2f9866" stroke-width="2"/><text x="1515.0" y="793" font-size="18" fill="#20392e" font-weight="700" text-anchor="middle">Close</text><text x="1515.0" y="817" font-size="12" fill="#536d5e" font-weight="450" text-anchor="middle">Audit + notify</text><path d="M480,745 L570,745" class="line"/><polyline points="570,745 570,808 630,808" fill="none" stroke="#b1c9b9" stroke-width="3"/><path d="M570,808 L630,808" class="arrow"/><path d="M480,875 L570,875" class="line"/><polyline points="570,875 570,808" fill="none" stroke="#b1c9b9" stroke-width="3"/><path d="M840,808 L990,808" class="arrow"/><path d="M1270,808 L1430,808" class="arrow"/><text x="80" y="971" font-size="16" fill="#65796c" font-weight="500" text-anchor="start">Business milestones, actor, SLA, outcome and timestamps appear in the ticket progress rail and immutable event timeline.</text></svg>