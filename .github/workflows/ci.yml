name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: ticketing_test
          POSTGRES_USER: ticketing_test
          POSTGRES_PASSWORD: ci-isolated-database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketing_test -d ticketing_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_DSN: pgsql:host=127.0.0.1;port=5432;dbname=ticketing_test
      DB_USER: ticketing_test
      DB_PASSWORD: ci-isolated-database
    steps:
      - uses: actions/checkout@v4
      - name: Prepare claim concurrency database
        run: |
          docker exec '${{ job.services.postgres.id }}' psql -U ticketing_test -d ticketing_test -c 'ALTER SYSTEM SET max_connections=250'
          docker restart '${{ job.services.postgres.id }}'
          for attempt in $(seq 1 30); do
            if docker exec '${{ job.services.postgres.id }}' pg_isready -h 127.0.0.1 -U ticketing_test -d ticketing_test; then break; fi
            sleep 1
          done
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: composer validate --strict
        working-directory: backend
      - run: find backend -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - run: php backend/tests/integration.php
      - run: python -m unittest discover -s JSC_Ticketing_Blueprint/tests -v
      - run: docker build -t jsc-ticketing-ci backend
      - run: docker compose -f deploy/compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-compose-validation
      - run: |
          for profile in offline development production; do
            docker compose --project-directory . --env-file ".env.$profile" -f deploy/compose.environments.yml config --quiet
          done
          docker compose --project-directory . --env-file .env.offline -f deploy/compose.environments.yml -f deploy/compose.offline.yml config --quiet
